<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="fullHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="50%" stop-color="#ff4b72"/>
      <stop offset="100%" stop-color="#ff758c"/>
    </linearGradient>
    <filter id="bigGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Big Red Heart Base -->
  <g filter="url(#bigGlow)">
    <path d="M 250 460 C 60 310, 20 150, 130 65 C 190 20, 250 80, 250 80 C 250 80, 310 20, 370 65 C 480 150, 440 310, 250 460 Z" fill="url(#fullHeartGrad)" stroke="#ffffff" stroke-width="8"/>
  </g>

  <!-- Shimmer & Sparkles -->
  <circle cx="150" cy="110" r="22" fill="#ffffff" opacity="0.35"/>
  <circle cx="115" cy="150" r="10" fill="#ffffff" opacity="0.25"/>

  <!-- Proposal Acceptance Text inside Heart -->
  <text x="250" y="240" font-family="'Caveat', cursive" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.3))">IYA, AKU MAU! 💖</text>
  <text x="250" y="290" font-family="'Caveat', cursive" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.3))">DITERIMA 🥰</text>
</svg>
