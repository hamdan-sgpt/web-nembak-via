      <stop offset="0%" stop-color="#808080"/>
      <stop offset="50%" stop-color="#a9a9a9"/>
      <stop offset="100%" stop-color="#696969"/>
    </linearGradient>
  </defs>

  <!-- Broken Gray Heart Base -->
  <path d="M 250 460 C 60 310, 20 150, 130 65 C 190 20, 250 80, 250 80 C 250 80, 310 20, 370 65 C 480 150, 440 310, 250 460 Z" fill="url(#brokenGrad)" stroke="#ffffff" stroke-width="6"/>

