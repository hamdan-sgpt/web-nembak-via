  <!-- Text inside Broken Heart -->
  <text x="250" y="240" font-family="'Caveat', cursive" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.5))">ENGGAK / DITOLAK 💔</text>
  <text x="250" y="285" font-family="'Caveat', cursive" font-size="32" font-weight="bold" fill="#ffd166" text-anchor="middle" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.5))">(Jangan Dipilih 🥺)</text>
